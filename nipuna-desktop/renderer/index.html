<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nipuna Desktop — Tally Connector</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <img src="../logo.jpg" alt="Nipuna AI" class="brand-logo" />
          <div>
            <h1>Nipuna Desktop</h1>
            <p class="brand-sub">Tally Connector Agent</p>
          </div>
        </div>
        <div class="status-badge" id="status-badge" data-status="idle">
          <span class="status-dot"></span>
          <span id="status-label">Idle</span>
        </div>
      </header>

      <!-- Status Panel -->
      <section class="status-panel" aria-live="polite">
        <p id="status-text">Waiting for connection.</p>
      </section>

      <!-- Action -->
      <section class="actions">
        <button id="btn-auth" class="btn btn-primary" type="button">
          <span class="btn-icon">↗</span>
          Sign in with Nipuna
        </button>
        <button id="btn-disconnect" class="btn btn-ghost" type="button" hidden>
          Disconnect
        </button>
      </section>

      <!-- Error -->
      <section class="error-box" id="error-box" hidden></section>

      <!-- Diagnostics / Technical details (collapsed by default) -->
      <details class="diagnostics-details">
        <summary>Show system status</summary>
        <div class="diagnostics-content">
          <!-- Service Status Cards -->
          <section class="services">
            <div class="service-card" id="card-backend">
              <div class="service-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                  <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                  <line x1="6" y1="6" x2="6.01" y2="6"></line>
                  <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
              </div>
              <div class="service-info">
                <span class="service-name">Backend</span>
                <span class="service-state" id="backend-state">Not connected</span>
              </div>
              <div class="service-indicator" id="backend-indicator"></div>
            </div>

            <div class="service-card" id="card-mcp">
              <div class="service-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
              </div>
              <div class="service-info">
                <span class="service-name">MCP Server</span>
                <span class="service-state" id="mcp-state">Starting…</span>
              </div>
              <div class="service-indicator" id="mcp-indicator"></div>
            </div>

            <div class="service-card" id="card-tally">
              <div class="service-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                  <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                  <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>
                </svg>
              </div>
              <div class="service-info">
                <span class="service-name">Tally Prime</span>
                <span class="service-state" id="tally-state">Not detected</span>
              </div>
              <div class="service-indicator" id="tally-indicator"></div>
            </div>
          </section>

          <!-- Footer -->
          <footer class="app-footer">
            <span>MCP server on</span>
            <strong>localhost:3000</strong>
            <span>·</span>
            <span>Tally XML on</span>
            <strong>localhost:9000</strong>
          </footer>
        </div>
      </details>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
