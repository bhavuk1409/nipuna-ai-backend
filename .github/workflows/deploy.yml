name: Deploy Nipuna AI Backend

on:
  push:
    branches: [main]
    paths:
      - "nipuna-backend/**"

env:
  AWS_REGION: ap-south-1
  ECR_API_REPO: nipuna-api
  ECR_WORKER_REPO: nipuna-worker
  ECS_CLUSTER: EcsStack-NipunaCluster704EC85F-RwF05yYHEVto
  ECS_API_SERVICE: EcsStack-NipunaApiService88093D2F-ZLYUX7lBzEGY
  ECS_WORKER_SERVICE: EcsStack-NipunaWorkerService4F3933A7-0JzeAxt2k5kU

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./nipuna-backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite

      - name: Run tests
        working-directory: ./nipuna-backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          ENV: test
          CLERK_SECRET_KEY: test
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: build-api
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG ./nipuna-backend
          docker tag $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_API_REPO:latest
          docker push $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_API_REPO:latest

      - name: Build and push Worker image
        id: build-worker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG -f ./nipuna-backend/Dockerfile.worker ./nipuna-backend
          docker tag $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_WORKER_REPO:latest
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:latest

      - name: Deploy API to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_API_SERVICE \
            --force-new-deployment

      - name: Deploy Worker to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_WORKER_SERVICE \
            --force-new-deployment
